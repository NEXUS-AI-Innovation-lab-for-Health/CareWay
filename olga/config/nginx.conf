server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve runtime config files as JSON and never fallback to index.html.
    location = /local.config {
        default_type application/json;
        try_files /local.config =404;
    }

    location = /config/config.json {
        default_type application/json;
        try_files /config/config.json =404;
    }

    location = /domain_config.json {
        default_type application/json;
        try_files /domain_config.json =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}