# Full Olga local stack (backend + mysql + designer + admin)
# Run from project root:
#   docker compose -f docker/docker-compose.olga-full.yml up -d --build

services:
  olga_mysql:
    image: mysql:latest
    container_name: olga_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: olga
    volumes:
      - olga_mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - olga_workflows

  olga_api:
    image: kirito140/olga-backend:latest
    container_name: olga_api
    ports:
      - "9091:9091"
    environment:
      ADDRESS: 0.0.0.0
      PORT: 9091
      MYSQL_URL: jdbc:mysql://olga_mysql:3306/olga
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      FIREBASE_KEY_PATH: /app/config/apiKey.json
    volumes:
      - ../olga/config/apiKey.json:/app/config/apiKey.json:ro
    depends_on:
      - olga_mysql
    restart: unless-stopped
    networks:
      - olga_workflows

  olga_designer:
    build:
      context: ../olga
      dockerfile: Dockerfile.designer
    container_name: olga_designer
    ports:
      - "8082:80"
    volumes:
      - ../olga/config/config.json:/usr/share/nginx/html/config/config.json:ro
      - ../olga/config/local.config:/usr/share/nginx/html/local.config:ro
      - ../olga/config/domain_config.json:/usr/share/nginx/html/domain_config.json:ro
    depends_on:
      - olga_api
    restart: unless-stopped
    networks:
      - olga_workflows

  olga_admin:
    build:
      context: ../olga
      dockerfile: Dockerfile.admin
    container_name: olga_admin
    ports:
      - "8083:80"
    volumes:
      - ../olga/config/config.json:/usr/share/nginx/html/config/config.json:ro
      - ../olga/config/local.config:/usr/share/nginx/html/local.config:ro
      - ../olga/config/domain_config.json:/usr/share/nginx/html/domain_config.json:ro
    depends_on:
      - olga_api
    restart: unless-stopped
    networks:
      - olga_workflows

networks:
  olga_workflows:
    driver: bridge

volumes:
  olga_mysql_data:
