server {
    listen 80;
    server_name localhost;

    # ── Olga Designer SPA ──────────────────────────────────────────────────────
    # Proxied at /olga/designer/  →  olga_designer:80 (served at /)
    location /olga/designer/ {
        proxy_pass          http://olga_designer/;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # WebSocket support (hot-reload / vite ws)
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_read_timeout  86400;

        # Rewrite absolute asset paths in HTML so the browser requests
        # them through the gateway rather than from the container root
        sub_filter_once     off;
        sub_filter          'src="/'          'src="/olga/designer/';
        sub_filter          'href="/'         'href="/olga/designer/';
        sub_filter          'from "/'         'from "/olga/designer/';
    }

    # ── Olga Admin SPA ────────────────────────────────────────────────────────
    # Proxied at /olga/admin/  →  olga_admin:80 (served at /)
    location /olga/admin/ {
        proxy_pass          http://olga_admin/;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_read_timeout  86400;

        # Rewrite absolute asset paths in HTML
        sub_filter_once     off;
        sub_filter          'src="/'          'src="/olga/admin/';
        sub_filter          'href="/'         'href="/olga/admin/';
        sub_filter          'from "/'         'from "/olga/admin/';
    }

    # ── Fallback ───────────────────────────────────────────────────────────────
    location / {
        return 404 "Olga gateway: use /olga/designer/ or /olga/admin/\n";
        add_header Content-Type text/plain;
    }
}
