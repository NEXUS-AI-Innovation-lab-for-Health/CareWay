services:
  # ================================
  # Frontend CareWay (Développement)
  # ================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: careway-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Monter le code source pour le hot reload
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - ./package.json:/app/package.json
      # Volume anonyme pour node_modules (cache optimisé)
      - /app/node_modules
    environment:
      # Variables d'environnement Vite (préfixées par VITE_)
      - NODE_ENV=development
      # Configuration Supabase Local
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-http://localhost:5432}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-your-anon-key-here}
    networks:
      - careway-network
    depends_on:
      supabase:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================
  # Supabase Local (Base de données PostgreSQL)
  # ================================
  supabase:
    image: postgres:15-alpine
    container_name: careway-supabase-db
    ports:
      - "5432:5432"
    volumes:
      # Persistance des données de la base
      - supabase_data:/var/lib/postgresql/data
      # Scripts d'initialisation
      - ./src/scripts:/docker-entrypoint-initdb.d
    environment:
      # Configuration PostgreSQL
      - POSTGRES_DB=${POSTGRES_DB:-careway}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    networks:
      - careway-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ================================
# Volumes
# ================================
volumes:
  supabase_data:
    driver: local

# ================================
# Networks
# ================================
networks:
  careway-network:
    driver: bridge
